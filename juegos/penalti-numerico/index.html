<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B1F">
<meta name="author" content="JvlSile">
<meta name="description" content="Penalti Numérico: duelo de cálculo para primaria. Dos equipos en la pizarra o tú contra la máquina.">
<title>Penalti Numérico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-800-italic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:italic;font-display:swap;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-style:italic;font-display:swap;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:900;font-style:italic;font-display:swap;src:url(fonts/barlow-condensed-latin-900-italic.woff2) format("woff2")}
@font-face{font-family:"Andika";font-weight:400;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Andika";font-weight:700;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format("woff2")}

:root{
  --night:#070B1F; --glass:rgba(9,13,34,.78); --glass-2:rgba(18,24,58,.86); --edge:rgba(255,255,255,.12);
  --chalk:#F5F7FF; --mist:#AEB8DC; --ink:#0B1027; --neon:#FFE14D;
  --red:#FF4D5E; --red-2:#FF8A3D; --red-d:#A3172A;
  --blue:#2F8BFF; --blue-2:#35D0FF; --blue-d:#123F94;
  --ok:#3BE08A; --bad:#FF5B6B;
  --hud:"Barlow Condensed","Andika",system-ui,sans-serif;
  --text:"Andika",system-ui,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--chalk);font:400 1.1rem/1.45 var(--text);background:var(--night);overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
::selection{background:var(--neon);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--neon);outline-offset:3px;border-radius:12px}
.hidden{display:none!important}
.team-a{--c:var(--red);--c2:var(--red-2);--cd:var(--red-d)}
.team-b{--c:var(--blue);--c2:var(--blue-2);--cd:var(--blue-d)}

/* ---------- Estadio ---------- */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:filter .5s var(--ease-out),transform .5s var(--ease-out)}
body.at-setup #scene{filter:blur(6px) brightness(.55) saturate(1.1);transform:scale(1.06)}
#scene.shake{animation:shake .5s}

/* Ambiente del estadio */
.beam{animation:beam 5s ease-in-out infinite alternate}
.beam.b2{animation-delay:-2.5s}
#crowd .sl{transform-box:view-box;animation:sway var(--d,2.2s) ease-in-out var(--o,0s) infinite alternate}
#crowd.ola .sl{animation:ola 1.1s cubic-bezier(.3,.7,.4,1) calc(var(--i) * 45ms) 1 both}
#crowd.cheer .sl{animation:jump .32s ease-in-out calc(var(--o) * .1) 6 alternate}
#flashes circle{animation:flash .32s ease-out forwards;transform-box:fill-box;transform-origin:center}
.flag .cloth{transform-box:fill-box;transform-origin:left center;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.75}to{opacity:1}}
@keyframes sway{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes ola{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes flash{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes wave{0%{transform:skewY(-8deg) scaleX(.94)}100%{transform:skewY(8deg) scaleX(1.04)}}
#boards text{font-family:var(--hud);font-weight:900;font-style:italic;font-size:26px;letter-spacing:.06em}
.zone rect{fill:rgba(10,20,60,.28);stroke:rgba(255,255,255,.55);stroke-width:3;stroke-dasharray:10 8}
.zone text{font-family:var(--hud);font-weight:700;font-size:70px;fill:#fff;paint-order:stroke;stroke:#070B1F;stroke-width:10px;text-anchor:middle;dominant-baseline:central}
.zone{transition:opacity .2s}
#zones.done .zone:not(.hit){opacity:.15}
.zone.hit rect{fill:rgba(255,225,77,.35);stroke:var(--neon);stroke-dasharray:none}
#ball{transition:transform .62s var(--ease-out)}
/* Portero: esqueleto articulado y poses */
#keeper{--kc:#2F8BFF;--kc2:#35D0FF;transition:transform .46s cubic-bezier(.2,.8,.25,1)}
#kshadow{transition:transform .46s cubic-bezier(.2,.8,.25,1)}
#keeper .rig,#keeper .leg,#keeper .shin,#keeper .arm,#keeper .fore,#keeper .head{transform-box:view-box;transition:transform .34s cubic-bezier(.2,.8,.25,1)}
#keeper .rig{transform-origin:0 -100px}
#keeper .bob{transform-box:view-box}
#keeper .leg{transform-origin:-15px -102px}
#keeper .shin{transform-origin:-15px -52px}
#keeper .arm{transform-origin:-34px -176px}
#keeper .fore{transform-origin:-34px -146px}
#keeper .head{transform-origin:0 -196px}
#keeper .eyes{transform-box:view-box;transform-origin:0 -216px;animation:kblink 4.2s infinite}
#keeper .m-open,#keeper .m-sad{display:none}
#keeper[data-face="open"] .m-ok,#keeper[data-face="sad"] .m-ok{display:none}
#keeper[data-face="open"] .m-open,#keeper[data-face="sad"] .m-sad{display:inline}
#keeper[data-state="idle"] .bob{animation:kbob 1.6s ease-in-out infinite}
#keeper[data-state="idle"] .arm{transform:rotate(14deg)}
#keeper[data-state="idle"] .fore{transform:rotate(12deg)}
#keeper[data-state="idle"] .head{animation:klook 3.2s ease-in-out infinite}
#keeper[data-state="ready"] .rig{transform:translateY(10px)}
#keeper[data-state="ready"] .bob{animation:kshuffle .42s ease-in-out infinite alternate}
#keeper[data-state="ready"] .leg{transform:rotate(16deg)}
#keeper[data-state="ready"] .shin{transform:rotate(-24deg)}
#keeper[data-state="ready"] .arm{transform:rotate(64deg)}
#keeper[data-state="ready"] .fore{transform:rotate(52deg)}
#keeper[data-state^="dive"] .arm{transform:rotate(172deg)}
#keeper[data-state^="dive"] .fore{transform:rotate(4deg)}
#keeper[data-state^="dive"] .head{transform:rotate(-8deg)}
#keeper[data-state="dive-l"] .rig{transform:rotate(-84deg)}
#keeper[data-state="dive-hl"] .rig{transform:rotate(-58deg)}
#keeper[data-state="dive-r"] .rig{transform:rotate(84deg)}
#keeper[data-state="dive-hr"] .rig{transform:rotate(58deg)}
#keeper[data-state="dive-l"] .leg-l,#keeper[data-state="dive-hl"] .leg-l,#keeper[data-state="dive-r"] .leg-r,#keeper[data-state="dive-hr"] .leg-r{transform:rotate(-6deg)}
#keeper[data-state="dive-l"] .leg-r,#keeper[data-state="dive-hl"] .leg-r,#keeper[data-state="dive-r"] .leg-l,#keeper[data-state="dive-hr"] .leg-l{transform:rotate(26deg)}
#keeper[data-state="dive-l"] .shin-r,#keeper[data-state="dive-hl"] .shin-r,#keeper[data-state="dive-r"] .shin-l,#keeper[data-state="dive-hr"] .shin-l{transform:rotate(-34deg)}
#keeper[data-state="jump"] .rig{transform:translateY(-30px)}
#keeper[data-state="jump"] .arm{transform:rotate(176deg)}
#keeper[data-state="jump"] .fore{transform:rotate(-6deg)}
#keeper[data-state="jump"] .leg{transform:rotate(8deg)}
#keeper[data-state="jump"] .shin{transform:rotate(-38deg)}
#keeper[data-state="block"] .rig{transform:translateY(22px)}
#keeper[data-state="block"] .arm{transform:rotate(-30deg)}
#keeper[data-state="block"] .fore{transform:rotate(-24deg)}
#keeper[data-state="block"] .leg{transform:rotate(24deg)}
#keeper[data-state="block"] .shin{transform:rotate(-36deg)}
#keeper[data-state="sad"] .rig{transform:translateY(4px)}
#keeper[data-state="sad"] .head{transform:rotate(8deg) translateY(4px)}
#keeper[data-state="sad"] .arm{transform:rotate(150deg)}
#keeper[data-state="sad"] .fore{transform:rotate(118deg)}
@keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes kshuffle{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes klook{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}65%{transform:rotate(5deg)}}
@keyframes kblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

#ball.flying{transition:transform .55s cubic-bezier(.2,.7,.3,1)}

/* ---------- Pantalla de inicio ---------- */
.setup{position:relative;z-index:2;height:100%;overflow:auto;padding:max(18px,env(safe-area-inset-top)) clamp(16px,4vw,56px) 24px;
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(18px,4vw,56px);align-items:center;max-width:1480px;margin:0 auto}
.logo{display:grid;gap:clamp(10px,2vh,18px);align-content:center}
.back{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);
  color:var(--mist);text-decoration:none;font-family:var(--hud);font-weight:700;font-style:italic;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(8px)}
.back:hover{color:var(--chalk)}
.back svg{width:18px;height:18px}
.logo h1{margin:0;font-family:var(--hud);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.84;letter-spacing:-.01em;
  font-size:clamp(3.6rem,9.5vw,9rem);transform:skewY(-4deg);transform-origin:left}
.logo h1 .l1{display:block;color:var(--chalk);text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(47,139,255,.35)}
.logo h1 .l2{display:block;color:var(--neon);text-shadow:0 6px 0 #8A6B00,0 0 46px rgba(255,225,77,.45)}
.logo p{margin:0;font-size:clamp(1.1rem,1.8vw,1.45rem);color:var(--chalk);max-width:24ch;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.logo .ball{width:clamp(70px,9vw,120px);height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:28px;padding:clamp(16px,2.6vw,30px);display:grid;gap:clamp(14px,2.2vh,22px);
  backdrop-filter:blur(14px);box-shadow:0 30px 70px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.field-l{font-family:var(--hud);font-weight:800;font-style:italic;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);margin-bottom:8px;display:block}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 14px;text-align:left;min-height:92px;padding:14px 16px;border-radius:20px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid var(--edge);transition:transform .18s var(--ease-out),border-color .18s,background .18s}
.tile:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.tile svg{grid-row:span 2;width:48px;height:48px;color:var(--mist)}
.tile b{font-family:var(--hud);font-weight:800;font-style:italic;font-size:1.45rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.tile span{color:var(--mist);font-size:.98rem;line-height:1.3}
.tile[aria-pressed="true"]{border-color:var(--neon);background:linear-gradient(160deg,rgba(255,225,77,.22),rgba(255,225,77,.04));box-shadow:0 10px 30px -12px rgba(255,225,77,.55)}
.tile[aria-pressed="true"] svg{color:var(--neon)}
.courses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.course{min-height:62px;border-radius:16px;font-family:var(--hud);font-weight:900;font-style:italic;font-size:1.9rem;line-height:1;
  background:rgba(255,255,255,.06);border:2px solid var(--edge);transition:transform .15s var(--ease-out),background .15s}
.course sup{font-size:.5em;vertical-align:.7em;margin-left:1px}
.course:hover{transform:translateY(-2px)}
.course[aria-pressed="true"]{background:var(--neon);color:var(--ink);border-color:var(--neon);box-shadow:0 10px 24px -10px rgba(255,225,77,.7)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:2px solid var(--edge);font-weight:700;font-size:1.02rem;transition:background .15s,border-color .15s}
.chip:hover{border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.team-in{position:relative}
.team-in input{width:100%;min-height:58px;border-radius:16px;border:2px solid var(--edge);background:rgba(4,7,22,.7);color:var(--chalk);
  font:800 italic 1.5rem var(--hud);text-transform:uppercase;letter-spacing:.03em;padding:6px 14px 6px 54px;caret-color:var(--c)}
.team-in input:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.team-in .sw{position:absolute;left:12px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c),var(--c2));transform:skewX(-10deg)}
.play{position:relative;justify-self:stretch;min-height:76px;border-radius:22px;background:linear-gradient(100deg,var(--neon),#FFB82E);color:var(--ink);
  font-family:var(--hud);font-weight:900;font-style:italic;font-size:clamp(2rem,3.4vw,2.6rem);letter-spacing:.04em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 18px 40px -14px rgba(255,200,40,.75);transition:transform .15s var(--ease-out)}
.play svg{width:34px;height:34px}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s 1s infinite}
.play:hover{transform:translateY(-2px)}
.play:active{transform:translateY(2px)}
.legal{grid-column:1/-1;text-align:center;color:var(--mist);font-size:.9rem;margin:0}

/* ---------- Partido: HUD ---------- */
.game{position:relative;z-index:2;height:100%}
.bug{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));translate:-50% 0;display:grid;grid-template-columns:auto auto auto auto auto;align-items:stretch;
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.55));z-index:4}
.bug .tm{display:flex;align-items:center;gap:10px;padding:0 18px;min-width:clamp(120px,15vw,220px);background:var(--glass-2);font-family:var(--hud);font-weight:800;font-style:italic;
  font-size:clamp(1.1rem,1.8vw,1.6rem);text-transform:uppercase;letter-spacing:.03em;backdrop-filter:blur(10px);white-space:nowrap}
.bug .tm span{overflow:hidden;text-overflow:ellipsis;max-width:12ch}
.bug .tm.a{clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);justify-content:flex-end;border-radius:14px 0 0 14px}
.bug .tm.b{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);border-radius:0 14px 14px 0}
.bug .tm i{width:12px;align-self:stretch;margin:10px 0;background:linear-gradient(180deg,var(--c),var(--c2));transform:skewX(-12deg);border-radius:3px}
.bug .sc{display:grid;place-items:center;min-width:clamp(56px,6vw,84px);background:linear-gradient(180deg,var(--c),var(--cd));font-family:var(--hud);font-weight:900;font-style:italic;
  font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1;padding:4px 10px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.bug .mid{display:grid;place-items:center;padding:0 14px;background:#05081A;font-family:var(--hud);font-weight:800;font-style:italic;font-size:clamp(.85rem,1.2vw,1.05rem);
  letter-spacing:.1em;text-transform:uppercase;color:var(--neon);white-space:nowrap}
.bug .dots{grid-column:1/-1;display:flex;justify-content:space-between;gap:20px;padding:6px 14px;background:rgba(5,8,26,.85);border-radius:0 0 14px 14px;margin:0 22px}
.bug .dots div{display:flex;gap:6px}
.dot{position:relative;width:clamp(14px,1.5vw,20px);height:clamp(14px,1.5vw,20px);border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.dot.gol{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(59,224,138,.6)}
.dot.fallo{border-color:var(--bad)}
.dot.fallo::before,.dot.fallo::after{content:"";position:absolute;left:12%;top:calc(50% - 1.5px);width:76%;height:3px;background:var(--bad);border-radius:2px;transform:rotate(45deg)}
.dot.fallo::after{transform:rotate(-45deg)}
.dot.now{border-color:var(--neon);animation:pulse 1s infinite}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:4}
.rb{width:52px;height:52px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;backdrop-filter:blur(8px);transition:transform .15s}
.rb:hover{transform:scale(1.06)}
.rb svg{width:24px;height:24px}

/* Consolas de equipo */
.console{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));width:clamp(260px,24vw,390px);display:grid;gap:clamp(8px,1.2vh,12px);z-index:3;
  padding:clamp(10px,1.2vw,16px);border-radius:26px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);
  box-shadow:0 30px 60px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);transition:box-shadow .3s,transform .3s var(--ease-out)}
.console.a{left:max(14px,env(safe-area-inset-left))}
.console.b{right:max(14px,env(safe-area-inset-right))}
.console.winner{box-shadow:0 0 0 3px var(--c),0 0 50px -6px var(--c),0 30px 60px -28px rgba(0,0,0,.9)}
.c-head{display:flex;align-items:stretch;justify-content:space-between;gap:8px;min-height:44px}
.c-team{display:flex;align-items:center;padding:0 14px 0 12px;font-family:var(--hud);font-weight:800;font-style:italic;font-size:clamp(1.1rem,1.6vw,1.45rem);text-transform:uppercase;
  letter-spacing:.03em;background:linear-gradient(100deg,var(--c),var(--c2));color:#fff;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);border-radius:12px 0 0 12px;
  padding-right:24px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.c-role{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);font-family:var(--hud);font-weight:900;font-style:italic;
  font-size:clamp(1.05rem,1.5vw,1.35rem);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.c-role svg{width:22px;height:22px;color:var(--c2)}
.c-op{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:rgba(2,4,16,.75);border:2px solid rgba(255,255,255,.08);min-height:clamp(64px,10vh,96px)}
.q{font-family:var(--hud);font-weight:700;font-size:clamp(2rem,3.4vw,3.2rem);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.q.wait{color:var(--mist)}
.ans{justify-self:stretch;min-width:2.4ch;height:100%;min-height:clamp(48px,7vh,72px);display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.18);font-family:var(--hud);font-weight:700;font-size:clamp(2rem,3.4vw,3.2rem);line-height:1;color:var(--neon);font-variant-numeric:tabular-nums}
.ans.ok{border-color:var(--ok);background:rgba(59,224,138,.16);color:#9CFFC8}
.ans.bad{border-color:var(--bad);background:rgba(255,91,107,.16);color:#FFB3BA;animation:nudge .35s}
.sol{grid-column:1/-1;font-weight:700;font-size:1.05rem;color:var(--mist);min-height:0}
.sol:empty{display:none}
.sol b{color:#9CFFC8}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(48px,8.2vh,84px);gap:clamp(6px,.8vw,10px)}
.key{border-radius:16px;background:linear-gradient(180deg,#FFFFFF,#DCE3F5);color:var(--ink);font-family:var(--hud);font-weight:700;font-size:clamp(1.8rem,3vw,2.7rem);line-height:1;
  display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(11,16,39,.18),0 6px 14px -6px rgba(0,0,0,.6);transition:transform .07s,box-shadow .07s}
.key svg{width:.9em;height:.9em}
.key.pressed{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(11,16,39,.18),0 2px 6px -3px rgba(0,0,0,.6)}
.key.send{grid-column:1/-1;background:linear-gradient(100deg,var(--c),var(--c2));color:#fff;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;
  font-size:clamp(1.6rem,2.4vw,2.2rem);text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 14px 30px -12px var(--c)}
.key.send.pressed{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 6px 16px -10px var(--c)}
.console.locked .keys{opacity:.4;filter:saturate(.4);pointer-events:none}
.cpu-face{display:none;align-items:center;gap:12px;padding:6px 4px;color:var(--mist);font-family:var(--hud);font-weight:800;font-style:italic;font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em}
.console.cpu .keys{display:none}
.console.cpu .cpu-face{display:flex}
.cpu-face svg{width:58px;height:58px;color:var(--c2);flex:none}
.thinking i{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:var(--c2);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}

/* Mensajes en el centro */
.callout{position:absolute;left:50%;top:44%;translate:-50% -50%;z-index:3;pointer-events:none;text-align:center;font-family:var(--hud);font-weight:900;font-style:italic;text-transform:uppercase;
  font-size:clamp(3rem,8vw,7rem);line-height:.9;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.5);opacity:0}
.callout.go{animation:pop .7s var(--ease-out) forwards}
.callout small{display:block;font-size:.32em;letter-spacing:.12em;color:var(--neon);margin-bottom:.2em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.strip{position:absolute;left:-5%;right:-5%;top:62%;height:clamp(90px,16vh,160px);z-index:3;pointer-events:none;display:grid;place-items:center;transform:skewY(-5deg) scaleX(0);transform-origin:left;
  background:linear-gradient(100deg,var(--c),var(--c2));box-shadow:0 20px 60px -10px rgba(0,0,0,.6)}
.strip b{font-family:var(--hud);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(4rem,12vw,10rem);line-height:1;color:#fff;letter-spacing:.02em;
  text-shadow:0 6px 0 rgba(0,0,0,.25);transform:skewY(5deg) translateX(30%);opacity:0}
.strip.show{animation:strip 1.5s var(--ease-out) forwards}
.strip.show b{animation:stripText 1.5s var(--ease-out) forwards}
.strip.neutral{--c:#5B6690;--c2:#8A95C2}
.strip.save{--c:#14A35B;--c2:#3BE08A}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s cubic-bezier(.3,.6,.5,1) forwards}

/* Final */
.final{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:rgba(3,5,16,.6);backdrop-filter:blur(6px)}
.final-card{width:min(780px,100%);max-height:100%;overflow:auto;background:var(--glass-2);border:1px solid var(--edge);border-radius:30px;padding:clamp(18px,3vw,34px);display:grid;gap:18px;text-align:center;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95);animation:rise .6s var(--ease-out)}
.trophy{width:clamp(70px,10vw,110px);height:auto;justify-self:center;filter:drop-shadow(0 10px 24px rgba(255,200,40,.45))}
.final-card h2{margin:0;font-family:var(--hud);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(2.4rem,6vw,4.2rem);line-height:.9;color:var(--neon)}
.final-score{display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--hud);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(1.3rem,3vw,2rem)}
.final-score .n{font-size:1.6em;font-weight:900}
.final-score .team-a{color:#FF8A95}.final-score .team-b{color:#7DC2FF}
.review{text-align:left;background:rgba(2,4,16,.6);border-radius:18px;padding:14px 18px;border:1px solid var(--edge)}
.review h3{margin:0 0 10px;font-family:var(--hud);font-weight:800;font-style:italic;letter-spacing:.08em;text-transform:uppercase;font-size:1.1rem;color:var(--mist)}
.review ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:1.1rem}
.review li b{font-family:var(--hud);font-weight:700;font-size:1.6rem;color:#fff;font-variant-numeric:tabular-nums}
.review li .r{color:#9CFFC8}
.review li .w{color:#FFB3BA}
.review li .who{color:var(--mist);font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{min-height:58px;padding:8px 24px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid var(--edge);font-family:var(--hud);font-weight:800;font-style:italic;font-size:1.35rem;
  text-transform:uppercase;letter-spacing:.04em;color:var(--chalk);text-decoration:none;display:inline-flex;align-items:center;transition:transform .15s var(--ease-out)}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:linear-gradient(100deg,var(--neon),#FFB82E);border-color:transparent;color:var(--ink);font-weight:900}

@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
@keyframes cheer{to{transform:translateY(-10px)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,225,77,.6)}50%{box-shadow:0 0 0 6px rgba(255,225,77,0)}}
@keyframes pop{0%{opacity:0;scale:1.6}25%{opacity:1;scale:1}80%{opacity:1;scale:1}100%{opacity:0;scale:.92}}
@keyframes strip{0%{transform:skewY(-5deg) scaleX(0)}18%{transform:skewY(-5deg) scaleX(1)}82%{transform:skewY(-5deg) scaleX(1);opacity:1}100%{transform:skewY(-5deg) scaleX(1);opacity:0}}
@keyframes stripText{0%,12%{opacity:0;transform:skewY(5deg) translateX(30%)}30%{opacity:1;transform:skewY(5deg) translateX(0)}82%{opacity:1;transform:skewY(5deg) translateX(-4%)}100%{opacity:0;transform:skewY(5deg) translateX(-12%)}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes shine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}

/* ---------- Vertical (móviles y tabletas en vertical) ---------- */
@media (orientation:portrait),(max-width:820px){
  body{overflow:auto}
  .setup{grid-template-columns:1fr;align-items:start;gap:18px}
  .logo h1{font-size:clamp(3.2rem,16vw,6rem)}
  .logo .ball{display:none}
  .modes,.teams{grid-template-columns:1fr}
  .courses{grid-template-columns:repeat(6,1fr)}
  body:not(.at-setup) #scene{height:40svh}
  .game{height:auto;min-height:100%;padding-top:calc(40svh - 10px);display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:10px;padding-left:10px;padding-right:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .console{position:relative;left:auto!important;right:auto!important;bottom:auto;width:auto}
  .bug{top:8px;position:fixed}
  .bug .tm{min-width:0;padding:0 10px;font-size:1rem}
  .bug .tm span{max-width:7ch}
  .bug .sc{min-width:46px;font-size:2rem}
  .bug .mid{display:none}
  .tools{position:fixed;top:calc(40svh - 64px);right:8px}
  .rb{width:44px;height:44px}
  .callout{position:fixed;top:21svh}
  .strip{position:fixed;top:14svh;height:100px}
  .q,.ans{font-size:clamp(1.6rem,7vw,2.4rem)}
  .keys{grid-auto-rows:clamp(44px,6.4vh,62px)}
  .key{font-size:clamp(1.6rem,6vw,2.2rem)}
  .key.send{font-size:1.5rem}
  .game.solo{grid-template-columns:1fr;padding-top:calc(30svh - 10px)}
  body.solo:not(.at-setup) #scene{height:30svh}
  body.solo .tools{top:calc(30svh - 58px)}
  body.solo .callout{top:15svh}
  body.solo .strip{top:9svh;height:84px}
  .game.solo .console.cpu{order:-1;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px}
  .game.solo .console.cpu .c-head{min-height:40px;flex:none}
  .game.solo .console.cpu .c-role{display:none}
  .game.solo .console.cpu .c-team{border-radius:10px;clip-path:none;padding:0 12px;font-size:1rem}
  .game.solo .console.cpu .c-op{flex:1;min-height:0;padding:4px 8px;grid-template-columns:auto 1fr;border-radius:12px}
  .game.solo .console.cpu .q,.game.solo .console.cpu .ans{font-size:1.4rem;min-height:36px}
  .game.solo .console.cpu .sol{display:none}
  .game.solo .console.cpu .cpu-face{padding:0;font-size:.95rem;flex:none}
  .game.solo .console.cpu .cpu-face svg,.game.solo .console.cpu .cpu-msg{display:none}
  .game.solo .console:not(.cpu) .keys{grid-auto-rows:clamp(46px,6.6svh,60px)}
}
@media (orientation:portrait) and (max-height:780px){
  body:not(.at-setup):not(.solo) #scene{height:34svh}
  .game:not(.solo){padding-top:calc(34svh - 10px)}
  body:not(.solo) .tools{top:calc(34svh - 60px)}
  .keys,.game.solo .console:not(.cpu) .keys{grid-auto-rows:42px}
  .c-op{min-height:0;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(function(){

  resta100: {label:'Restas hasta 100', gen:function(){ var a=R(25,99), b=R(5,a-10); return {q:a+' − '+b, a:a-b}; }},
  dobles:   {label:'Dobles y mitades', gen:function(){ if (Math.random()<.5){ var n=R(2,50); return {q:'Doble de '+n, a:n*2}; } var m=R(1,50)*2; return {q:'Mitad de '+m, a:m/2}; }},
  tablas:   {label:'Tablas', gen:function(){ var a=R(2,10), b=R(2,10); return {q:a+' × '+b, a:a*b}; }},
  suma1000: {label:'Sumas y restas hasta 1000', gen:function(){ if (Math.random()<.5){ var a=R(100,850), b=R(10,99); return {q:a+' + '+b, a:a+b}; } var c=R(150,999), d=R(10,99); return {q:c+' − '+d, a:c-d}; }},

  fraccion: {label:'Fracción de un número', gen:function(){ var den=pick([2,3,4,5,10]), num=R(1,den-1), n=den*R(2,10); return {q:num+'/'+den+' de '+n, a:num*n/den}; }},
  decimales:{label:'Sumas con decimales', gen:function(){ var a=R(11,95)/10, b=R(11,95)/10; return {q:fmt(a)+' + '+fmt(b), a:Math.round((a+b)*10)/10}; }},

  potencias:{label:'Potencias', gen:function(){ if (Math.random()<.7){ var n=R(2,12); return {q:n+'²', a:n*n}; } var m=R(2,5); return {q:m+'³', a:m*m*m}; }},

var COURSES = {1:['suma20','resta20'],2:['suma100','resta100','dobles'],3:['tablas','suma1000','division'],4:['tablas','mult2x1','division2'],5:['fraccion','decimales','combinadas','division2'],6:['porcentajes','combinadas','potencias','decimales10']};

/* ---------- Grada: franjas verticales que se balancean y hacen la ola ---------- */
(function(){

/* ---------- Flashes de fotos ---------- */
var flashTimer=null;
function flash(n){
  if (reduce) return;
  var g=$('flashes');
  for (var i=0;i<n;i++){
    (function(delay){
      setTimeout(function(){
        var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx',R(10,1590)); c.setAttribute('cy',R(215,455)); c.setAttribute('r',R(12,22)); c.setAttribute('fill','url(#flashG)');
        g.appendChild(c); setTimeout(function(){ c.remove(); }, 360);
      }, delay);
    })(i===0?0:R(0,1400));
  }
}
function flashLoop(){ clearTimeout(flashTimer); flash(R(1,2)); flashTimer=setTimeout(flashLoop, R(250,900)); }
flashLoop();
function ola(){ var c=$('crowd'); if (reduce || c.classList.contains('cheer')) return; c.classList.remove('ola'); void c.getBBox(); c.classList.add('ola'); setTimeout(function(){ c.classList.remove('ola'); }, 3200); }

/* ---------- Sonido ---------- */
var AC=null, muted=false;
try { muted = localStorage.getItem('penalti-mudo')==='1'; } catch(e){}
function ac(){ if (muted) return null; if (!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if (AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type,vol,delay){ var c=ac(); if(!c) return null; var o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(delay||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.15,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05); return o; }
function noise(d,freq,vol,delay,q){ var c=ac(); if(!c) return; var n=Math.floor(c.sampleRate*d), buf=c.createBuffer(1,n,c.sampleRate), data=buf.getChannelData(0);
  for (var i=0;i<n;i++) data[i]=Math.random()*2-1;
  var s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(), t=c.currentTime+(delay||0);
  s.buffer=buf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||.8;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+d*.3); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(c.destination); s.start(t); }
var sfx = {
  whistle:function(){ var o=tone(2900,.45,'sine',.08); if(o){ var c=ac(), l=c.createOscillator(), lg=c.createGain(); l.frequency.value=38; lg.gain.value=120; l.connect(lg).connect(o.frequency); l.start(); l.stop(c.currentTime+.5);} },
  tick:function(){ tone(880,.08,'triangle',.08); },
  key:function(){ tone(660,.04,'triangle',.04); },
  kick:function(){ tone(95,.2,'sine',.4); noise(.08,900,.18); },
  goal:function(){ noise(2.2,1000,.24,.05,.5); [523,659,784,1047].forEach(function(f,i){ tone(f,.28,'triangle',.09,.1+i*.09); }); },
  save:function(){ noise(1.2,480,.18,.02,.6); tone(330,.2,'triangle',.08,.05); tone(440,.25,'triangle',.08,.18); },
  miss:function(){ noise(1,300,.12,0,.6); tone(220,.28,'sawtooth',.05); tone(165,.35,'sawtooth',.05,.18); },
  wrong:function(){ tone(180,.22,'square',.05); }

/* ---------- Ambiente sonoro: murmullo, bombo, palmas y cánticos ---------- */
var CROWD={gain:null,src:null,timer:null};
function crowdStart(){
  var c=ac(); if(!c || CROWD.src) return;
  var n=c.sampleRate*3, buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0), last=0;
  for (var i=0;i<n;i++){ last = last*.97 + (Math.random()*2-1)*.03; d[i]=last*6 + (Math.random()*2-1)*.15; }
  var s=c.createBufferSource(); s.buffer=buf; s.loop=true;
  var f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=650; f.Q.value=.5;
  var g=c.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.05,c.currentTime+1.5);
  s.connect(f).connect(g).connect(c.destination); s.start();
  CROWD.src=s; CROWD.gain=g;
  clearTimeout(CROWD.timer); CROWD.timer=setTimeout(chantLoop, 4000);
}
function crowdLevel(v,t){ var c=AC; if(!c||!CROWD.gain) return; CROWD.gain.gain.cancelScheduledValues(c.currentTime); CROWD.gain.gain.setTargetAtTime(v,c.currentTime,(t||.4)/3); }
function crowdStop(){ clearTimeout(CROWD.timer); if (CROWD.src){ try{ CROWD.src.stop(); }catch(e){} CROWD.src=null; CROWD.gain=null; } }
function drum(t,v){ var c=ac(); if(!c) return; var o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(48,t+.18);
  g.gain.setValueAtTime(v||.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(c.destination); o.start(t); o.stop(t+.32); }
function claps(t,v){ var c=ac(); if(!c) return; for (var k=0;k<7;k++){ var tt=t+Math.random()*.035, n=Math.floor(c.sampleRate*.05), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for (var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
  var s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=1200+Math.random()*900; f.Q.value=1.2; g.gain.value=(v||.07);
  s.connect(f).connect(g).connect(c.destination); s.start(tt); } }
// Voces de la grada: muchas voces desafinadas pasadas por formantes de vocal
var VOWEL={o:[500,850],e:[420,2000],a:[750,1200]};
function voices(freq,t,dur,vowel,vol){
  var c=ac(); if(!c) return; var fm=VOWEL[vowel], out=c.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(vol,t+.06); out.gain.setValueAtTime(vol,t+dur*.7); out.gain.linearRampToValueAtTime(0,t+dur);
  var f1=c.createBiquadFilter(), f2=c.createBiquadFilter(); f1.type=f2.type='bandpass'; f1.frequency.value=fm[0]; f2.frequency.value=fm[1]; f1.Q.value=4; f2.Q.value=6;
  f1.connect(out); f2.connect(out); out.connect(c.destination);
  for (var i=0;i<9;i++){ var o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq*(i%3===0?.5:1); o.detune.value=(Math.random()*2-1)*28;
    o.connect(f1); o.connect(f2); var st=t+Math.random()*.05; o.start(st); o.stop(t+dur+.05); }
}
// «¡Oé, oé, oé, oéééé!» con bombo
function chantOe(vol){
  var c=ac(); if(!c) return; var t=c.currentTime+.05, v=vol||.05, b=.36;
  var mel=[[440,'o',1],[370,'e',1.4],[440,'o',1],[370,'e',1.4],[440,'o',1],[370,'e',1.4],[440,'o',1],[494,'e',1],[440,'e',2.6]];
  mel.forEach(function(m){ voices(m[0],t,b*m[2]*.95,m[1],v); drum(t,.28); t+=b*m[2]; });
}
// Palmas a ritmo: «pam, pam, pam-pam-pam»
function chantClaps(){
  var c=ac(); if(!c) return; var t=c.currentTime+.05;
  [0,.5,1,1.25,1.5, 2.5,3,3.5,3.75,4].forEach(function(x){ claps(t+x); drum(t+x,.22); });
}
function chantLoop(){
  clearTimeout(CROWD.timer);
  if (!G || G.done || $('game').classList.contains('hidden')) return;
  if (G.busy===false && !G.counting) (Math.random()<.5 ? chantOe(.035) : chantClaps());
  if (Math.random()<.35) ola();
  CROWD.timer=setTimeout(chantLoop, R(9000,15000));
}
function renderMute(){ $('mute').setAttribute('aria-pressed',String(muted)); $('mute').setAttribute('aria-label', muted?'Activar sonido':'Silenciar sonido'); $('wave').style.display = muted?'none':''; }
$('mute').addEventListener('click',function(){ muted=!muted; try{ localStorage.setItem('penalti-mudo', muted?'1':'0'); }catch(e){} renderMute(); if (muted) crowdStop(); else if (G && !G.done) crowdStart(); });
renderMute();

/* ---------- Iconos ---------- */
var ICON_KICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="17" r="4"/><path d="M3 20l5-3 3-6M8 6a2 2 0 1 0 0-.1M11 11l4 2"/></svg>';
var ICON_GLOVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21h9v-4l3-5V7a1.5 1.5 0 0 0-3 0v3V5a1.5 1.5 0 0 0-3 0v5V4a1.5 1.5 0 0 0-3 0v6V6a1.5 1.5 0 0 0-3 0v8l-2-2a1.5 1.5 0 0 0-2 2l4 5z"/></svg>';
var ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"/></svg>';
var ROBOT = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="12" y="18" width="40" height="32" rx="9"/><path d="M32 18V9M22 34h.5M42 34h.5M25 43h14M6 30v8M58 30v8"/><circle cx="32" cy="7" r="3"/></svg>';

/* ---------- Partido ---------- */
var G = null;
var ZONES = [[640,310],[800,310],[960,310],[640,430],[800,430],[960,430]];
var KEEPER_COL = [['#FF4D5E','#FF8A3D'],['#2F8BFF','#35D0FF']];

function panel(s){ return $(s?'pB':'pA'); }
function buildPanel(side){
  var el=panel(side), isCpu = G.solo && side===1;
  el.classList.toggle('cpu', isCpu);
  var h = '<div class="c-head"><span class="c-team">'+esc(G.names[side])+'</span><span class="c-role"></span></div>'+
          '<div class="c-op"><span class="q"></span><span class="ans"></span><span class="sol"></span></div>';
  if (isCpu) h += '<div class="cpu-face">'+ROBOT+'<span class="cpu-msg"></span><span class="thinking hidden"><i></i><i></i><i></i></span></div>';
  else {
    h += '<div class="keys">';
    ['1','2','3','4','5','6','7','8','9',',','0','del'].forEach(function(k){
      h += '<button type="button" class="key" data-k="'+k+'" aria-label="'+(k==='del'?'Borrar':k===','?'Coma':k)+'">'+(k==='del'?ICON_BACK:k)+'</button>'; });
    h += '<button type="button" class="key send" data-k="ok"></button></div>';
  }
  el.innerHTML = h;
  if (!isCpu) el.querySelectorAll('.key').forEach(function(b){
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); b.classList.add('pressed'); input(side,b.dataset.k); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev,function(){ b.classList.remove('pressed'); }); });
    b.addEventListener('click',function(e){ if (e.detail===0) input(side,b.dataset.k); });
  });
}
function newOp(){ var t = G.type==='mezcla' ? pick(COURSES[G.course]) : G.type; return TYPES[t].gen(); }
function matches(str, a){ if (!str || str===',') return false; var v=parseFloat(str.replace(',','.')); return Math.abs(v - Math.round(a*100)/100) < 1e-9; }

function startMatch(){
  saveNames();
  try { localStorage.setItem('penalti-ajustes', JSON.stringify(S)); } catch(e){}
  if (G) clearTimeout(G.timer);
  G = {solo:S.mode==='solo', course:S.course, type:S.type, level:S.level,
       names: S.mode==='solo' ? [S.nSolo||'Tú','Máquina'] : [S.nA,S.nB],
       res:[[],[]], turn:0, errors:[], busy:true, timer:null};
  document.body.classList.remove('at-setup');
  $('setup').classList.add('hidden'); $('final').classList.add('hidden'); $('game').classList.remove('hidden');
  $('game').classList.toggle('solo', G.solo); document.body.classList.toggle('solo', G.solo);
  $('sbA').textContent=G.names[0]; $('sbB').textContent=G.names[1];
  buildPanel(0); buildPanel(1);
  ac(); crowdStart();
  nextShot();
}
function toSetup(){
  if (G){ clearTimeout(G.timer); G.done=true; }
  crowdStop();
  $('final').classList.add('hidden'); $('game').classList.add('hidden'); $('setup').classList.remove('hidden');
  document.body.classList.add('at-setup'); resetScene(); renderMode();
}
$('start').addEventListener('click', startMatch);
$('again').addEventListener('click', startMatch);
$('change').addEventListener('click', toSetup);
$('quit').addEventListener('click', toSetup);

function renderBoard(){
  [0,1].forEach(function(s){
    var r=G.res[s], n=Math.max(5, r.length + (G.shooter===s && !G.done ? 1 : 0), G.res[1-s].length), h='';
    for (var i=0;i<n;i++){ var cls = i<r.length ? (r[i]?'gol':'fallo') : (i===r.length && G.shooter===s && !G.done ? 'now' : ''); h+='<span class="dot '+cls+'"></span>'; }
    $(s?'dB':'dA').innerHTML=h;
    $(s?'gB':'gA').textContent = r.filter(Boolean).length;
  });
  var shot = Math.floor(G.turn/2)+1;
  $('round').textContent = shot>5 ? 'Muerte súbita' : 'Penalti '+shot+' de 5';
}

function nextShot(){
  clearTimeout(G.timer);
  G.shooter = G.turn % 2; G.keeper = 1 - G.shooter;
  G.ops = [newOp(), newOp()]; G.input=['',''];
  G.busy=true; G.done=false;
  resetScene();
  var kp=$('keeper'); kp.style.setProperty('--kc',KEEPER_COL[G.keeper][0]); kp.style.setProperty('--kc2',KEEPER_COL[G.keeper][1]);
  [0,1].forEach(function(s){
    var p=panel(s), shooting = s===G.shooter;
    p.classList.remove('winner'); p.classList.add('locked');
    p.querySelector('.c-role').innerHTML = shooting ? ICON_KICK+'Chuta' : ICON_GLOVE+'Para';
    var q=p.querySelector('.q'); q.textContent='¿ ?'; q.classList.add('wait');
    var ans=p.querySelector('.ans'); ans.className='ans'; ans.textContent='';
    p.querySelector('.sol').textContent='';
    var send=p.querySelector('.send'); if (send) send.textContent = shooting ? '¡Chuta!' : '¡Para!';
    if (G.solo && s===1){ p.querySelector('.cpu-msg').textContent = 'Preparado'; p.querySelector('.thinking').classList.add('hidden'); }
  });
  G.zone = R(0,5);
  var h='';
  if (G.course>=3){
    var nums = distractors(G.ops[G.shooter].a); nums.splice(G.zone,0,G.ops[G.shooter].a);
    ZONES.forEach(function(z,i){ h+='<g class="zone" data-i="'+i+'"><rect x="'+(z[0]-74)+'" y="'+(z[1]-54)+'" width="148" height="108" rx="14"/><text x="'+z[0]+'" y="'+(z[1]+2)+'">'+fmt(nums[i])+'</text></g>'; });
  }
  $('zones').innerHTML=h;
  renderBoard();
  callout('<small>'+esc(G.names[G.shooter])+' chuta</small>¿Listos?'); crowdLevel(.012,.6); G.counting=true;
  sfx.tick();
  G.timer = setTimeout(function(){
    if (G.done) return;
    callout('¡Ya!'); sfx.whistle(); $('keeper').dataset.state='ready'; crowdLevel(.06,.8); G.counting=false;
    G.busy=false;
    [0,1].forEach(function(s){ var p=panel(s), q=p.querySelector('.q'); q.textContent=G.ops[s].q+' ='; q.classList.remove('wait'); p.classList.remove('locked'); });
    if (G.solo) cpuPlay();
  }, reduce ? 500 : 1300);
}
function callout(html){ var c=$('callout'); c.innerHTML=html; c.classList.remove('go'); void c.offsetWidth; c.classList.add('go'); }
function distractors(a){
  var dec = Math.round(a)!==a, steps = dec ? [.1,.2,1,.5,2,10] : [1,2,10,3,5,20,11,9], out=[];
  steps.forEach(function(s){ [a+s,a-s].forEach(function(v){ v=Math.round(v*100)/100; if (v>=0 && v!==a && out.indexOf(v)<0) out.push(v); }); });
  out.sort(function(){ return Math.random()-.5; });
  return out.slice(0,5);
}

function input(side,k){
  if (!G || G.busy || G.done) return;
  if (G.solo && side===1) return;
  var cur=G.input[side];
  if (k==='ok'){ if (cur && cur!==',') submit(side); return; }
  sfx.key();
  if (k==='del') cur=cur.slice(0,-1);
  else if (k===','){ if (cur.indexOf(',')<0 && cur.length<7) cur = (cur||'0')+','; }
  else if (cur.length<7) cur = (cur==='0' ? '' : cur)+k;
  G.input[side]=cur;
  panel(side).querySelector('.ans').textContent=cur;
}
document.addEventListener('keydown',function(e){
  if (!G || $('game').classList.contains('hidden')) return;
  var k=e.key;
  if (/^[0-9]$/.test(k)) input(0,k);
  else if (k===','||k==='.') input(0,',');
  else if (k==='Backspace') input(0,'del');
  else if (k==='Enter') input(0,'ok');
  else return;
  e.preventDefault();
});

function cpuPlay(){
  var lv=LEVELS[G.level], p=$('pB');
  p.querySelector('.thinking').classList.remove('hidden');
  p.querySelector('.cpu-msg').textContent='Pensando';
  G.timer=setTimeout(function(){
    if (G.busy || G.done) return;
    var a=G.ops[1].a, wrong = Math.random()<lv.err;
    G.input[1] = fmt(wrong ? pick(distractors(a).slice(0,2)) : a);
    p.querySelector('.ans').textContent=G.input[1];
    submit(1);
  }, R(lv.t[0],lv.t[1]));
}

function submit(side){
  if (G.busy) return;
  G.busy=true; clearTimeout(G.timer);
  var ok = matches(G.input[side], G.ops[side].a), outcome, p=panel(side), other=1-side;
  var ans=p.querySelector('.ans');
  if (ok){ ans.classList.add('ok'); outcome = side===G.shooter ? 'gol' : 'parada'; }
  else {
    ans.classList.add('bad'); sfx.wrong();
    p.querySelector('.sol').innerHTML='Era <b>'+fmt(G.ops[side].a)+'</b>';
    G.errors.push({who:G.names[side], side:side, q:G.ops[side].q, w:G.input[side], a:fmt(G.ops[side].a)});
    outcome = side===G.shooter ? 'fuera' : 'gol';
  }
  panel(0).classList.add('locked'); panel(1).classList.add('locked');
  panel(other).querySelector('.sol').innerHTML='Era <b>'+fmt(G.ops[other].a)+'</b>';
  if (G.solo){ var pb=$('pB'); pb.querySelector('.thinking').classList.add('hidden'); pb.querySelector('.cpu-msg').textContent = side===1 ? 'Responde '+G.input[1] : 'Demasiado lento'; }
  var winner = outcome==='gol' ? G.shooter : G.keeper;
  panel(winner).classList.add('winner');
  G.res[G.shooter].push(outcome==='gol');
  shoot(outcome, function(){ G.turn++; renderBoard(); if (!checkEnd()) G.timer=setTimeout(nextShot, 500); });
}

/* ---------- Escena ---------- */
function setT(el,x,y,extra){ el.style.transform='translate('+x+'px,'+y+'px) '+(extra||''); }
function resetScene(){
  var ball=$('ball'), kp=$('keeper'), sh=$('ballShadow'), spin=$('ballSpin');
  ball.style.transition='none'; kp.style.transition='none'; sh.style.transition='none'; spin.style.transition='none';
  ball.classList.remove('flying');
  setT(ball,800,800,''); spin.style.transform=''; setT(kp,800,528,''); kp.dataset.state='idle'; kp.dataset.face='ok'; $('kshadow').style.transform='translateX(800px)';
  sh.style.opacity='1';
  ball.getBoundingClientRect();
  ball.style.transition=''; kp.style.transition=''; sh.style.transition='opacity .4s';
  $('strip').className='strip'; $('confetti').innerHTML='';
  $('boardText').textContent='ÓRBITA ESCOLAR · PENALTI NUMÉRICO · ÓRBITA ESCOLAR · PENALTI NUMÉRICO · ÓRBITA ESCOLAR';
  $('boardText').setAttribute('fill','#FFE14D');
  $('scene').classList.remove('shake'); $('crowd').classList.remove('cheer'); $('zones').classList.remove('done');
}
function shoot(outcome, done){
  var z = ZONES[G.zone], ball=$('ball'), kp=$('keeper'), spin=$('ballSpin');
  sfx.kick();
  ball.classList.add('flying');
  $('ballShadow').style.opacity='0';
  spin.style.transition='transform .55s linear'; spin.style.transform='rotate('+(z[0]<800?-540:540)+'deg)';
  var hit = document.querySelector('.zone[data-i="'+G.zone+'"]');
  var row = G.zone<3 ? 0 : 1, col = G.zone%3;
  $('zones').classList.add('done');
  if (outcome==='gol'){
    if (hit) hit.classList.add('hit');
    setT(ball, z[0]+(z[0]<800?-38:38), z[1]+30, 'scale(.42)');
    keeperTo(row, col===1 ? pick([0,2]) : 2-col);
  } else if (outcome==='parada'){
    keeperTo(row, col);
    setT(ball, z[0]+(col===0?-20:col===2?20:0), z[1]+(col===1&&row===1?40:20), 'scale(.46)');
  } else {
    setT(ball, z[0]+(z[0]<800?-90:90), 150, 'scale(.36)');
    keeperTo(pick([0,1]), pick([0,2]));
  }
  setTimeout(function(){
    var strip=$('strip'), st=$('stripText');
    strip.classList.remove('team-a','team-b','neutral','save');
    if (outcome==='gol'){
      st.textContent='¡Gol!'; strip.classList.add(G.shooter===0?'team-a':'team-b'); setTimeout(function(){ kp.dataset.face='sad'; }, 300);
      sfx.goal(); confetti(G.shooter); flash(45); crowdLevel(.12,.3); setTimeout(function(){ chantOe(.05); crowdLevel(.05,2); }, 1400);
      if (!reduce){ $('scene').classList.add('shake'); $('crowd').classList.add('cheer'); }
      $('boardText').textContent='¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL! · ¡GOL!';
      $('boardText').setAttribute('fill', G.shooter===0 ? '#FF6B78' : '#4FB4FF');
    } else if (outcome==='parada'){
      st.textContent='¡Paradón!'; strip.classList.add('save'); sfx.save(); kp.dataset.face='open'; flash(18); setTimeout(chantClaps, 900);
      setT(ball, z[0]+(z[0]<800?-160:160), 560, 'scale(.6)');
    } else {
      st.textContent='¡Fuera!'; strip.classList.add('neutral'); sfx.miss();
    }
    void strip.offsetWidth; strip.classList.add('show');
    G.timer = setTimeout(done, reduce ? 1100 : 1600);
  }, reduce ? 20 : 560);
}
// Estirada del portero hacia una zona (fila 0 arriba, 1 abajo; columna 0 izquierda, 1 centro, 2 derecha)
var DIVES = {'0,0':[792,498,'dive-hl'],'0,1':[800,528,'jump'],'0,2':[808,498,'dive-hr'],'1,0':[814,548,'dive-l'],'1,1':[800,528,'block'],'1,2':[786,548,'dive-r']};
function keeperTo(row,col){
  var d=DIVES[row+','+col], kp=$('keeper');
  kp.dataset.face='open'; kp.dataset.state=d[2]; setT(kp,d[0],d[1],'');
  var dx = d[2].indexOf('l')>4 ? -110 : d[2].indexOf('r')>4 ? 110 : 0;
  $('kshadow').style.transform='translateX('+(d[0]+dx)+'px) scaleX('+(dx?1.6:1)+')';
}
function confetti(side){
  if (reduce) return;
  var cols = side===0 ? ['#FF4D5E','#FF8A3D','#FFE14D','#fff'] : ['#2F8BFF','#35D0FF','#FFE14D','#fff'], h='';
  for (var i=0;i<70;i++) h+='<i style="left:'+R(0,100)+'%;background:'+pick(cols)+';--dx:'+R(-80,80)+'px;--r:'+R(-500,500)+'deg;animation-delay:'+(Math.random()*.5).toFixed(2)+'s"></i>';
  $('confetti').innerHTML=h;
}

/* ---------- Fin de la tanda ---------- */
function checkEnd(){
  var a=G.res[0], b=G.res[1], ga=a.filter(Boolean).length, gb=b.filter(Boolean).length, na=a.length, nb=b.length, end=false;
  if (na<=5 && nb<=5){
    if (ga + (5-na) < gb || gb + (5-nb) < ga) end=true;
    else if (na===5 && nb===5 && ga!==gb) end=true;
  } else if (na===nb && ga!==gb) end=true;
  if (na>=15 && nb>=15) end=true;
  if (!end) return false;
  G.done=true; renderBoard();
  G.timer = setTimeout(function(){ showFinal(ga,gb); }, 500);
  return true;
}
function showFinal(ga,gb){
  crowdLevel(.02,1.5); clearTimeout(CROWD.timer); if (ga!==gb){ chantOe(.05); flash(30); }
  var t;
  if (ga===gb) t='¡Empate!';
  else if (G.solo) t = ga>gb ? '¡Has ganado!' : 'Gana la máquina';
  else t='¡Ganan '+esc(ga>gb?G.names[0]:G.names[1])+'!';
  $('fT').innerHTML=t;
  $('fS').innerHTML='<span class="team-a">'+esc(G.names[0])+'</span><span class="n team-a">'+ga+'</span>–<span class="n team-b">'+gb+'</span><span class="team-b">'+esc(G.names[1])+'</span>';
  var list = G.solo ? G.errors.filter(function(e){ return e.side===0; }) : G.errors;
  $('fR').innerHTML = !list.length ? '<h3>Repaso</h3><p style="margin:0">Ningún fallo. ¡Cálculo perfecto!</p>' :
    '<h3>Repaso de fallos</h3><ul>'+list.map(function(e){
      return '<li><b>'+esc(e.q)+' = <span class="r">'+esc(e.a)+'</span></b><span class="w">respuesta: '+esc(e.w)+'</span>'+(G.solo?'':'<span class="who">'+esc(e.who)+'</span>')+'</li>'; }).join('')+'</ul>';
  if (ga!==gb) confetti(ga>gb?0:1);
  $('final').classList.remove('hidden');
  $('again').focus();
}

if ('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(function(){});
})();
